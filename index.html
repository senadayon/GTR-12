<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暇潰しチャット</title>
<script src="/socket.io/socket.io.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #17191f;
    color: #f5f5f5;
}

button, input, select {
    font: inherit;
}

button {
    padding: 9px 12px;
    border: none;
    border-radius: 6px;
    background: #5865f2;
    color: white;
    cursor: pointer;
    margin: 3px 0;
}

button:hover {
    filter: brightness(1.12);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border: 1px solid #454955;
    border-radius: 6px;
    background: #30333d;
    color: white;
}

header {
    min-height: 58px;
    padding: 16px;
    text-align: center;
    background: #242731;
    font-size: 20px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

#login {
    max-width: 400px;
    margin: 70px auto;
    padding: 24px;
    background: #242731;
    border-radius: 12px;
}

#joinButton {
    width: 100%;
    margin-top: 10px;
}

#error {
    color: #ff8585;
    margin-top: 10px;
    overflow-wrap: anywhere;
}

#chat {
    display: none;
    height: calc(100vh - 58px);
}

.layout {
    display: flex;
    height: 100%;
    min-height: 0;
}

#main {
    display: flex;
    flex: 1;
    min-width: 0;
    flex-direction: column;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
}

.message {
    background: #242731;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 9px;
    overflow-wrap: anywhere;
}

.message-header {
    margin-bottom: 5px;
}

.message-name {
    font-weight: bold;
}

.message-role {
    color: #a9b2ff;
    font-size: 12px;
    margin-left: 5px;
}

.message-time {
    color: #9da2ad;
    font-size: 11px;
    margin-left: 8px;
}

.message-text {
    white-space: pre-wrap;
}

#bottom {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #242731;
}

#messageInput {
    flex: 1;
    min-width: 0;
}

#sendButton {
    align-self: center;
}

#sidebar {
    width: 270px;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 12px;
    background: #20232b;
}

#userList {
    list-style: none;
    padding: 0;
    margin: 0;
}

#userList li {
    padding: 7px 4px;
    border-bottom: 1px solid #343741;
    overflow-wrap: anywhere;
}

.user-role {
    color: #a9b2ff;
    font-size: 12px;
}

#adminToggle {
    width: 100%;
    margin-top: 15px;
}

#adminPanel {
    display: none;
    margin-top: 12px;
    padding: 12px;
    background: #292d38;
    border-radius: 8px;
}

#adminPanel h3,
#adminPanel h4 {
    margin-top: 10px;
}

#adminPanel button {
    width: 100%;
}

.section {
    border-top: 1px solid #454955;
    padding-top: 10px;
    margin-top: 12px;
}

#notice {
    padding: 8px 12px;
    color: #ffcf75;
    overflow-wrap: anywhere;
}

#pinned {
    display: none;
    padding: 12px;
    background: #413b23;
    overflow-wrap: anywhere;
}

.permission-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin: 8px 0;
    padding: 8px;
    border-radius: 5px;
    background: #343844;
    cursor: pointer;
}

.permission-item input {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin: 1px 0 0;
    accent-color: #5865f2;
}

.permission-item span {
    overflow-wrap: anywhere;
}

#permissionStatus {
    color: #ffcf75;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.small-note {
    color: #b9bdc9;
    font-size: 12px;
    line-height: 1.6;
}

.hidden {
    display: none !important;
}

@media (max-width: 650px) {
    #sidebar {
        width: 145px;
        padding: 8px;
        font-size: 13px;
    }

    #messages {
        padding: 8px;
    }

    #bottom {
        padding: 6px;
        gap: 4px;
    }

    #sendButton {
        padding: 9px;
    }

    #adminPanel {
        padding: 7px;
    }

    .message {
        padding: 8px;
    }
}
</style>
</head>

<body>

<header id="roomTitle">暇潰しチャット</header>

<section id="login">
    <h2>チャットに参加</h2>

    <label for="username">ユーザー名</label>
    <input
        id="username"
        maxlength="20"
        autocomplete="username"
        placeholder="ユーザー名を入力"
    >

    <label for="adminCode">Ownerパスワード</label>
    <input
        id="adminCode"
        type="password"
        autocomplete="current-password"
        placeholder="Ownerのみ入力"
    >

    <button id="joinButton" type="button" onclick="joinChat()">
        参加する
    </button>

    <div id="error" role="status"></div>
</section>

<section id="chat">
    <div class="layout">

        <main id="main">
            <div id="pinned"></div>
            <div id="notice" role="status"></div>
            <div id="messages" aria-live="polite"></div>

            <div id="bottom">
                <input
                    id="messageInput"
                    maxlength="1000"
                    placeholder="メッセージを入力..."
                    autocomplete="off"
                >
                <button id="sendButton" onclick="sendMessage()">
                    送信
                </button>
            </div>
        </main>

        <aside id="sidebar">
            <h3>オンラインユーザー</h3>
            <ul id="userList"></ul>

            <button id="adminToggle" onclick="toggleAdmin()">
                管理者パネル
            </button>

            <div id="adminPanel">

                <h3>管理者パネル</h3>

                <div class="section">
                    <h4>ユーザー管理</h4>

                    <label for="targetUser">対象ユーザー名</label>
                    <input
                        id="targetUser"
                        maxlength="20"
                        placeholder="対象ユーザー"
                    >

                    <button onclick="adminAction('kick')">
                        キック
                    </button>

                    <button onclick="adminAction('ban')">
                        BAN
                    </button>

                    <button onclick="adminAction('unban')">
                        BAN解除
                    </button>

                    <button onclick="adminAction('mute')">
                        ミュート
                    </button>

                    <button onclick="adminAction('unmute')">
                        ミュート解除
                    </button>
                </div>

                <div class="section">
                    <h4>ランク変更</h4>

                    <label for="rankValue">変更するランク</label>
                    <select id="rankValue">
                        <option value="Admin">Admin</option>
                        <option value="Moderator">Moderator</option>
                        <option value="Member">Member</option>
                        <option value="Regular">Regular</option>
                    </select>

                    <button onclick="changeRank()">
                        ランクを変更
                    </button>

                    <p class="small-note">
                        Ownerのランクは変更できません。
                        ランク変更はオンラインユーザーが対象です。
                    </p>
                </div>

                <div class="section">
                    <h4>ランク別の個別権限</h4>

                    <p class="small-note">
                        設定したいランクを選択し、各権限をON／OFFにして保存してください。
                        Ownerは常に全権限を持ちます。
                        Regularの管理権限は常にOFFです。
                    </p>

                    <label for="permissionRole">設定対象ランク</label>
                    <select id="permissionRole">
                        <option value="Admin">Admin</option>
                        <option value="Moderator">Moderator</option>
                        <option value="Member">Member</option>
                    </select>

                    <div id="permissionList">
                        <p class="small-note">
                            権限設定を読み込んでいます...
                        </p>
                    </div>

                    <button onclick="savePermissions()">
                        権限設定を保存
                    </button>

                    <div id="permissionStatus" role="status"></div>
                </div>

                <div class="section">
                    <h4>チャット設定</h4>

                    <button onclick="adminAction('lock')">
                        チャットをロック
                    </button>

                    <button onclick="adminAction('unlock')">
                        ロック解除
                    </button>

                    <label for="slowValue">
                        スローモード（秒）
                    </label>

                    <input
                        id="slowValue"
                        type="number"
                        min="0"
                        max="60"
                        value="0"
                    >

                    <button onclick="setSlowMode()">
                        スローモードを設定
                    </button>
                </div>

                <div class="section">
                    <h4>固定メッセージ</h4>

                    <input
                        id="pinValue"
                        maxlength="500"
                        placeholder="固定する文章"
                    >

                    <button onclick="pinMessage()">
                        メッセージを固定
                    </button>

                    <button onclick="adminAction('unpin')">
                        固定を解除
                    </button>
                </div>

                <div class="section">
                    <h4>NGワード</h4>

                    <input
                        id="ngValue"
                        maxlength="50"
                        placeholder="NGワード"
                    >

                    <button onclick="changeNGWord('ng_add')">
                        NGワードを追加
                    </button>

                    <button onclick="changeNGWord('ng_remove')">
                        NGワードを削除
                    </button>
                </div>

                <div class="section">
                    <h4>チャット履歴</h4>

                    <button onclick="clearMessages()">
                        全メッセージ削除
                    </button>
                </div>

            </div>
        </aside>

    </div>
</section>

<script>
const socket = io();

let myUsername = '';
let myRole = 'Regular';
let joined = false;

let permissionData = null;

const permissionLabels = {
    kick: 'ユーザーをキック',
    ban: 'ユーザーをBAN',
    unban: 'BAN解除',
    mute: 'ユーザーをミュート',
    unmute: 'ミュート解除',
    lock: 'チャットをロック',
    unlock: 'チャットのロック解除',
    slowmode: 'スローモード設定',
    pin: 'メッセージ固定',
    unpin: '固定解除',
    ng_add: 'NGワード追加',
    ng_remove: 'NGワード削除',
    clear: '全メッセージ削除'
};

const permissionRoles = [
    'Admin',
    'Moderator',
    'Member'
];

function byId(id) {
    return document.getElementById(id);
}

// 入室
function joinChat() {
    if (joined) return;

    const username = byId('username').value.trim();
    const adminCode = byId('adminCode').value;

    if (!username) {
        byId('error').textContent =
            'ユーザー名を入力してください';
        return;
    }

    byId('error').textContent = '';
    byId('joinButton').disabled = true;

    socket.emit('join', {
        username,
        adminCode
    });
}

// 入室エラー
socket.on('login_error', message => {
    byId('error').textContent = message;
    byId('joinButton').disabled = false;
});

// 入室完了
socket.on('joined', data => {
    joined = true;
    myUsername = data.username;
    myRole = data.role || 'Regular';

    byId('login').style.display = 'none';
    byId('chat').style.display = 'block';

    updateRoomTitle();
    updateAdminPanel();

    byId('messages').replaceChildren();

    if (Array.isArray(data.messages)) {
        data.messages.forEach(addMessage);
    }

    updatePinnedMessage(data.pinnedMessage);

    if (myRole === 'Owner') {
        socket.emit('get_permissions');
    }
});

// タイトル更新
function updateRoomTitle() {
    byId('roomTitle').textContent =
        '暇潰しチャット — ' +
        myUsername +
        ' [' + myRole + ']';
}

// 管理パネル表示
function updateAdminPanel() {
    const owner = myRole === 'Owner';

    byId('adminToggle').classList.toggle(
        'hidden',
        !owner
    );

    if (!owner) {
        byId('adminPanel').style.display = 'none';
    }
}

// 管理パネル開閉
function toggleAdmin() {
    if (myRole !== 'Owner') {
        showNotice('Owner専用の機能です');
        return;
    }

    const panel = byId('adminPanel');

    const opening = panel.style.display !== 'block';

    panel.style.display = opening ? 'block' : 'none';

    if (opening) {
        socket.emit('get_permissions');
    }
}

// サーバーからの通知
socket.on('system_message', message => {
    showNotice(message);
});

function showNotice(message) {
    byId('notice').textContent = String(message || '');
}

// メッセージ受信
socket.on('chat_message', message => {
    addMessage(message);
});

// メッセージ表示
function addMessage(message) {
    if (!message || typeof message !== 'object') {
        return;
    }

    const box = document.createElement('div');
    box.className = 'message';

    const header = document.createElement('div');
    header.className = 'message-header';

    const name = document.createElement('span');
    name.className = 'message-name';
    name.textContent = String(message.username || 'Unknown');

    const role = document.createElement('span');
    role.className = 'message-role';
    role.textContent = '[' + String(message.role || 'Regular') + ']';

    const time = document.createElement('span');
    time.className = 'message-time';
    time.textContent = String(message.time || '');

    header.append(name, role, time);

    const text = document.createElement('div');
    text.className = 'message-text';
    text.textContent = String(message.text || '');

    box.append(header, text);

    byId('messages').appendChild(box);

    byId('messages').scrollTop =
        byId('messages').scrollHeight;
}

// メッセージ送信
function sendMessage() {
    if (!joined) return;

    const input = byId('messageInput');
    const text = input.value.trim();

    if (!text) return;

    socket.emit('chat_message', text);

    input.value = '';
    input.focus();
}

// オンライン一覧
socket.on('user_list', users => {
    const list = byId('userList');
    list.replaceChildren();

    if (!Array.isArray(users)) return;

    users.forEach(user => {
        const item = document.createElement('li');

        const name = document.createElement('div');
        name.textContent = String(user.username || 'Unknown');

        const role = document.createElement('div');
        role.className = 'user-role';
        role.textContent = String(user.role || 'Regular');

        item.append(name, role);
        list.appendChild(item);
    });
});

// ランク変更通知
socket.on('role_updated', data => {
    if (!data || data.username !== myUsername) {
        return;
    }

    myRole = data.role || 'Regular';

    updateRoomTitle();
    updateAdminPanel();

    showNotice(
        'あなたのランクが ' + myRole + ' に変更されました'
    );

    if (myRole === 'Owner') {
        socket.emit('get_permissions');
    }
});

// 固定メッセージ更新
socket.on('pinned_message', text => {
    updatePinnedMessage(text);
});

function updatePinnedMessage(text) {
    const pinned = byId('pinned');

    if (typeof text === 'string' && text.length > 0) {
        pinned.style.display = 'block';
        pinned.textContent = '📌 ' + text;
    } else {
        pinned.style.display = 'none';
        pinned.textContent = '';
    }
}

// 全メッセージ削除
socket.on('clear_messages', () => {
    byId('messages').replaceChildren();
});

// 管理操作送信
function adminAction(action, value = '') {
    if (!joined) {
        showNotice('先にチャットに参加してください');
        return;
    }

    socket.emit('admin_action', {
        action,
        target: byId('targetUser').value.trim(),
        value
    });
}

// ランク変更
function changeRank() {
    const target = byId('targetUser').value.trim();
    const rank = byId('rankValue').value;

    if (!target) {
        showNotice('対象ユーザー名を入力してください');
        return;
    }

    if (!confirm(
        target + ' のランクを ' + rank + ' に変更しますか？'
    )) {
        return;
    }

    adminAction('rank', rank);
}

// スローモード設定
function setSlowMode() {
    const seconds = Number(byId('slowValue').value);

    if (!Number.isFinite(seconds) || seconds < 0 || seconds > 60) {
        showNotice('0〜60秒で設定してください');
        return;
    }

    adminAction('slowmode', seconds);
}

// 固定メッセージ
function pinMessage() {
    const text = byId('pinValue').value.trim();

    if (!text) {
        showNotice('固定する文章を入力してください');
        return;
    }

    adminAction('pin', text);
}

// NGワード操作
function changeNGWord(action) {
    const word = byId('ngValue').value.trim();

    if (!word) {
        showNotice('NGワードを入力してください');
        return;
    }

    adminAction(action, word);
}

// 全メッセージ削除
function clearMessages() {
    if (!confirm('チャット履歴をすべて削除しますか？')) {
        return;
    }

    adminAction('clear');
}

// ====================================
// ランク別の個別権限設定
// ====================================

// サーバーから権限データを受け取る
socket.on('permissions_data', data => {
    if (myRole !== 'Owner') return;

    if (!data || typeof data !== 'object') {
        showPermissionStatus('権限データが無効です');
        return;
    }

    permissionData = data;

    renderPermissionEditor();
});

// 権限設定画面を作成
function renderPermissionEditor() {
    const container = byId('permissionList');
    container.replaceChildren();

    if (myRole !== 'Owner') {
        container.textContent =
            '権限設定を表示できるのはOwnerだけです';
        return;
    }

    if (!permissionData) {
        container.textContent =
            '権限設定を読み込んでいます...';
        return;
    }

    const role = byId('permissionRole').value;
    const permissions = permissionData[role];

    if (!permissions) {
        container.textContent =
            'このランクの権限データがありません';
        return;
    }

    Object.entries(permissionLabels).forEach(([key, label]) => {
        const row = document.createElement('label');
        row.className = 'permission-item';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.dataset.permission = key;
        checkbox.checked = permissions[key] === true;

        const text = document.createElement('span');
        text.textContent = label;

        row.append(checkbox, text);
        container.appendChild(row);
    });

    showPermissionStatus(
        role + ' の権限設定を表示中'
    );
}

// 選択するランクを変更
byId('permissionRole').addEventListener('change', () => {
    renderPermissionEditor();
});

// 権限保存
function savePermissions() {
    if (myRole !== 'Owner') {
        showPermissionStatus(
            '権限設定を変更できるのはOwnerだけです'
        );
        return;
    }

    const role = byId('permissionRole').value;

    if (!permissionRoles.includes(role)) {
        showPermissionStatus(
            '設定対象のランクが無効です'
        );
        return;
    }

    if (!permissionData) {
        showPermissionStatus(
            '権限データを読み込めていません'
        );
        return;
    }

    const permissions = {};

    byId('permissionList')
        .querySelectorAll('input[data-permission]')
        .forEach(checkbox => {
            permissions[checkbox.dataset.permission] =
                checkbox.checked;
        });

    socket.emit('admin_action', {
        action: 'set_permissions',
        role,
        permissions
    });

    showPermissionStatus(
        role + ' の権限設定を保存しています...'
    );
}

// 権限設定保存結果の通知
socket.on('system_message', message => {
    const text = String(message || '');

    if (
        text.includes('権限設定を保存しました') ||
        text.includes('権限設定はOwnerのみ')
    ) {
        showPermissionStatus(text);
    }
});

// 権限データ更新通知
socket.on('permissions_updated', data => {
    if (!data || !data.role || !data.permissions) {
        return;
    }

    if (!permissionData) {
        permissionData = {};
    }

    permissionData[data.role] = data.permissions;

    if (myRole === 'Owner') {
        renderPermissionEditor();
    }
});

// 権限設定の状態表示
function showPermissionStatus(message) {
    byId('permissionStatus').textContent =
        String(message || '');
}

// Enterキーで送信
byId('messageInput').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        sendMessage();
    }
});

// ユーザー名欄でEnterを押したら入室
byId('username').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        joinChat();
    }
});

// 接続エラー
socket.on('connect_error', () => {
    byId('error').textContent =
        'サーバーに接続できません。再読み込みしてみてください。';

    byId('joinButton').disabled = false;
});
</script>

</body>
</html>
