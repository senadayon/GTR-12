<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暇潰しチャット</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: #f9fafb;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 16px;
}

.card {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
}

input,
select,
button {
    font: inherit;
    padding: 10px;
    border: 1px solid #4b5563;
    border-radius: 7px;
    background: #111827;
    color: white;
}

button {
    background: #2563eb;
    cursor: pointer;
    margin: 3px;
}

button:hover {
    filter: brightness(1.15);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.danger {
    background: #b91c1c;
}

.secondary {
    background: #374151;
}

.hidden {
    display: none !important;
}

#login {
    max-width: 420px;
    margin: 12vh auto;
}

#layout {
    display: none;
    grid-template-columns: minmax(0, 1fr) 240px;
    gap: 14px;
}

#messages {
    height: 45vh;
    min-height: 260px;
    overflow-y: auto;
    background: #111827;
    border-radius: 8px;
    padding: 10px;
}

.message {
    padding: 9px 0;
    border-bottom: 1px solid #374151;
    overflow-wrap: anywhere;
}

.role {
    color: #93c5fd;
    font-size: 12px;
    margin-left: 6px;
}

.time {
    color: #9ca3af;
    font-size: 11px;
    margin-left: 8px;
}

.row {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin: 8px 0;
}

.row input {
    flex: 1;
    min-width: 100px;
}

#notice {
    color: #fbbf24;
    min-height: 24px;
}

#admin {
    display: none;
}

.admin-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
    );
    gap: 10px;
}

.admin-box {
    border: 1px solid #4b5563;
    border-radius: 9px;
    padding: 12px;
}

.admin-box h3 {
    margin-top: 0;
}

.admin-box input,
.admin-box select {
    width: 100%;
    min-width: 0;
}

.check {
    display: block;
    margin: 7px 0;
}

.check input {
    width: auto;
}

#pinned {
    padding: 10px;
    background: #374151;
    border-radius: 8px;
    margin-bottom: 10px;
}

.user-item {
    padding: 8px 0;
    border-bottom: 1px solid #374151;
    cursor: pointer;
    overflow-wrap: anywhere;
}

@media (max-width: 700px) {
    #layout {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 8px;
    }
}
</style>
</head>

<body>
<div class="container">

<!-- ログイン画面 -->
<section id="login" class="card">
    <h1>💬 チャットルーム</h1>

    <form id="joinForm">
        <input
            id="username"
            maxlength="24"
            placeholder="ユーザー名"
            required
            style="width:100%"
        >

        <p>
            <input
                id="ownerSecret"
                type="password"
                placeholder="Owner秘密鍵（Ownerのみ）"
                style="width:100%"
            >
        </p>

        <button type="submit" style="width:100%">
            参加する
        </button>

        <p id="loginError"></p>
    </form>
</section>

<!-- チャット画面 -->
<section id="layout">

<div>

    <section class="card">
        <h2>暇潰しチャット</h2>

        <div id="pinned" class="hidden"></div>

        <div id="messages"></div>

        <p id="notice"></p>

        <form id="messageForm" class="row">
            <input
                id="messageInput"
                maxlength="500"
                placeholder="メッセージを入力..."
                autocomplete="off"
                required
            >

            <button type="submit">
                送信
            </button>
        </form>

        <small id="slowStatus"></small>
    </section>

    <!-- 管理者パネル -->
    <section id="admin" class="card">

        <h2>🛠 管理者パネル</h2>

        <div class="admin-grid">

            <!-- ランク変更 -->
            <div class="admin-box">
                <h3>👑 ランク変更</h3>

                <input
                    id="targetUser"
                    placeholder="対象ユーザー名"
                >

                <p>
                    <select id="rankValue">
                        <option value="Regular">Regular</option>
                        <option value="Member">Member</option>
                        <option value="Moderator">Moderator</option>
                        <option value="Admin">Admin</option>
                        <option value="Owner">Owner</option>
                    </select>
                </p>

                <button
                    id="changeRankButton"
                    type="button"
                >
                    ランクを変更
                </button>
            </div>

            <!-- ユーザー管理 -->
            <div class="admin-box">
                <h3>👤 ユーザー管理</h3>

                <input
                    id="moderationTarget"
                    placeholder="対象ユーザー名"
                >

                <div class="row">
                    <button type="button" data-action="kick">
                        Kick
                    </button>

                    <button type="button" data-action="ban" class="danger">
                        BAN
                    </button>

                    <button type="button" data-action="unban" class="secondary">
                        BAN解除
                    </button>

                    <button type="button" data-action="mute" class="secondary">
                        Mute
                    </button>

                    <button type="button" data-action="unmute" class="secondary">
                        Mute解除
                    </button>
                </div>
            </div>

            <!-- チャット設定 -->
            <div class="admin-box">
                <h3>⚙️ チャット設定</h3>

                <button type="button" data-action="lock" class="danger">
                    チャットロック
                </button>

                <button type="button" data-action="unlock" class="secondary">
                    ロック解除
                </button>

                <hr>

                <label for="slowSeconds">
                    スローモード（秒・0でOFF）
                </label>

                <div class="row">
                    <input
                        id="slowSeconds"
                        type="number"
                        min="0"
                        max="3600"
                        value="0"
                    >

                    <button id="setSlow" type="button">
                        設定
                    </button>
                </div>

                <hr>

                <input
                    id="pinText"
                    maxlength="500"
                    placeholder="固定メッセージ"
                >

                <button id="pinButton" type="button">
                    メッセージ固定
                </button>

                <button type="button" data-action="unpin" class="secondary">
                    固定解除
                </button>

                <hr>

                <button type="button" data-action="clear" class="danger">
                    チャット履歴消去
                </button>
            </div>

            <!-- NGワード -->
            <div class="admin-box">
                <h3>🚫 NGワード</h3>

                <input
                    id="ngWord"
                    maxlength="80"
                    placeholder="NGワード"
                >

                <button id="addNg" type="button">
                    追加
                </button>

                <button id="removeNg" type="button" class="secondary">
                    削除
                </button>

                <p id="ngList"></p>
            </div>

            <!-- ランク別権限 -->
            <div id="permissionBox" class="admin-box">
                <h3>🔐 ランク別権限</h3>

                <select id="permissionRank">
                    <option value="Admin">Admin</option>
                    <option value="Moderator">Moderator</option>
                    <option value="Member">Member</option>
                </select>

                <div id="permissionChecks"></div>

                <button id="savePermissions" type="button">
                    権限を保存
                </button>
            </div>

        </div>
    </section>

</div>

<!-- 参加者一覧 -->
<aside class="card">
    <h2>
        参加者
        <span id="userCount">0</span>
    </h2>

    <p id="myInfo"></p>

    <hr>

    <div id="users"></div>
</aside>

</section>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
(() => {

    const socket = io();

    const $ = id => document.getElementById(id);

    let myUsername = '';
    let myRole = 'Regular';

    let permissions = {};
    let chatLocked = false;
    let slowMode = 0;

    const permissionNames = {
        kick: 'Kick',
        ban: 'BAN',
        unban: 'BAN解除',
        mute: 'Mute',
        unmute: 'Mute解除',
        lock: 'チャットロック',
        unlock: 'ロック解除',
        slowmode: 'スローモード',
        pin: 'メッセージ固定',
        unpin: '固定解除',
        ng_add: 'NGワード追加',
        ng_remove: 'NGワード削除',
        clear: '履歴消去'
    };

    // =========================
    // ログイン
    // =========================

    $('joinForm').addEventListener('submit', event => {
        event.preventDefault();

        const username = $('username').value.trim();
        const secret = $('ownerSecret').value;

        socket.emit(
            'join',
            {
                username,
                secret
            },
            result => {

                if (!result || !result.ok) {
                    $('loginError').textContent =
                        result?.error || '参加できませんでした。';

                    return;
                }

                myUsername = result.username;
                myRole = result.role;

                $('login').style.display = 'none';
                $('layout').style.display = 'grid';

                $('myInfo').textContent =
                    `${myUsername} / ${myRole}`;

                updateAdminVisibility();
            }
        );
    });

    function updateAdminVisibility() {

        $('admin').style.display =
            ['Owner', 'Admin', 'Moderator'].includes(myRole)
                ? 'block'
                : 'none';

        $('permissionBox').classList.toggle(
            'hidden',
            myRole !== 'Owner'
        );

        $('changeRankButton').disabled =
            myRole !== 'Owner';
    }

    // =========================
    // メッセージ表示
    // =========================

    function addMessage(message) {

        const div = document.createElement('div');
        div.className = 'message';

        const name = document.createElement('strong');

        name.textContent =
            message.username || 'システム';

        div.appendChild(name);

        if (message.role) {
            const role = document.createElement('span');

            role.className = 'role';
            role.textContent = `[${message.role}]`;

            div.appendChild(role);
        }

        const body = document.createElement('div');

        body.textContent = message.text || '';

        div.appendChild(body);

        if (message.at) {
            const time = document.createElement('span');

            time.className = 'time';

            time.textContent =
                new Date(message.at).toLocaleTimeString('ja-JP');

            div.appendChild(time);
        }

        $('messages').appendChild(div);

        $('messages').scrollTop =
            $('messages').scrollHeight;
    }

    $('messageForm').addEventListener('submit', event => {
        event.preventDefault();

        const text = $('messageInput').value.trim();

        if (!text) {
            return;
        }

        socket.emit('chat_message', text);

        $('messageInput').value = '';
    });

    // =========================
    // サーバーからのイベント
    // =========================

    socket.on('joined', data => {

        $('messages').replaceChildren();

        (data.messages || []).forEach(addMessage);

        chatLocked = !!data.chatLocked;
        slowMode = Number(data.slowMode || 0);

        setPinnedMessage(data.pinnedMessage);

        updateChatStatus();
    });

    socket.on('chat_message', addMessage);

    socket.on('system_message', data => {

        $('notice').textContent =
            typeof data === 'string'
                ? data
                : data?.text || '';
    });

    socket.on('user_list', users => {

        $('users').replaceChildren();

        $('userCount').textContent = users.length;

        users.forEach(user => {

            const div = document.createElement('div');

            div.className = 'user-item';

            div.textContent =
                `${user.username} [${user.role}]` +
                (user.muted ? ' (Mute)' : '');

            div.addEventListener('click', () => {

                $('targetUser').value = user.username;

                $('moderationTarget').value =
                    user.username;
            });

            $('users').appendChild(div);
        });
    });

    socket.on('role_updated', data => {

        myRole = data.role;

        $('myInfo').textContent =
            `${myUsername} / ${myRole}`;

        updateAdminVisibility();

        $('notice').textContent =
            `あなたのランクが ${myRole} に変更されました。`;
    });

    socket.on('permissions_data', data => {

        permissions = data.permissions || {};

        if (typeof data.chatLocked === 'boolean') {
            chatLocked = data.chatLocked;
        }

        slowMode = Number(data.slowMode || 0);

        renderPermissionChecks();

        renderNGWords(data.ngWords || []);

        setPinnedMessage(data.pinnedMessage);

        updateChatStatus();
    });

    socket.on('permissions_updated', data => {

        permissions = data.permissions || permissions;

        renderPermissionChecks();
    });

    socket.on('chat_settings', data => {

        chatLocked = !!data.chatLocked;
        slowMode = Number(data.slowMode || 0);

        updateChatStatus();
    });

    socket.on('pinned_message', data => {
        setPinnedMessage(data?.text);
    });

    socket.on('clear_messages', () => {
        $('messages').replaceChildren();
    });

    socket.on('kicked', data => {

        alert(data?.text || '退出させられました。');

        location.reload();
    });

    socket.on('connect_error', () => {

        $('loginError').textContent =
            'サーバーに接続できません。';
    });

    // =========================
    // 固定メッセージ
    // =========================

    function setPinnedMessage(text) {

        const box = $('pinned');

        if (text) {
            box.textContent = `📌 ${text}`;
            box.classList.remove('hidden');
        } else {
            box.textContent = '';
            box.classList.add('hidden');
        }
    }

    // =========================
    // チャット設定表示
    // =========================

    function updateChatStatus() {

        $('slowStatus').textContent =
            (chatLocked ? '🔒 チャットロック中 ' : '') +
            (slowMode > 0
                ? `⏱️ スローモード：${slowMode}秒`
                : 'スローモードOFF');
    }

    // =========================
    // 管理者操作送信
    // =========================

    function adminAction(action, target = '', value) {

        const payload = {
            action,
            target
        };

        if (value !== undefined) {
            payload.value = value;
        }

        socket.emit('admin_action', payload);
    }

    // =========================
    // ★ ランク変更ボタン
    // =========================

    $('changeRankButton').addEventListener(
        'click',
        () => {

            if (myRole !== 'Owner') {
                alert('ランク変更はOwnerのみ実行できます。');
                return;
            }

            if (!socket.connected) {
                alert('サーバーに接続されていません。');
                return;
            }

            const target =
                $('targetUser').value.trim();

            const rank =
                $('rankValue').value;

            if (!target) {
                alert('対象ユーザー名を入力してください。');
                return;
            }

            const validRanks = [
                'Owner',
                'Admin',
                'Moderator',
                'Member',
                'Regular'
            ];

            if (!validRanks.includes(rank)) {
                alert('ランクが正しくありません。');
                return;
            }

            if (
                !confirm(
                    `${target} のランクを ${rank} に変更しますか？`
                )
            ) {
                return;
            }

            adminAction('rank', target, rank);
        }
    );

    // =========================
    // Kick・BAN・Muteなど
    // =========================

    document.querySelectorAll('[data-action]').forEach(button => {

        button.addEventListener('click', () => {

            const action = button.dataset.action;

            const target =
                $('moderationTarget').value.trim();

            if (
                [
                    'kick',
                    'ban',
                    'unban',
                    'mute',
                    'unmute'
                ].includes(action) &&
                !target
            ) {
                alert(
                    '対象ユーザー名を入力するか、参加者一覧から選択してください。'
                );

                return;
            }

            if (
                ['kick', 'ban', 'clear', 'lock'].includes(action) &&
                !confirm('この操作を実行しますか？')
            ) {
                return;
            }

            adminAction(action, target);
        });

    });

    // =========================
    // スローモード
    // =========================

    $('setSlow').addEventListener('click', () => {

        const seconds = Number(
            $('slowSeconds').value
        );

        if (
            !Number.isFinite(seconds) ||
            seconds < 0 ||
            seconds > 3600
        ) {
            alert('0〜3600秒で入力してください。');
            return;
        }

        adminAction('slowmode', '', seconds);
    });

    // =========================
    // メッセージ固定
    // =========================

    $('pinButton').addEventListener('click', () => {

        const text = $('pinText').value.trim();

        if (!text) {
            alert('固定するメッセージを入力してください。');
            return;
        }

        adminAction('pin', '', text);
    });

    // =========================
    // NGワード
    // =========================

    $('addNg').addEventListener('click', () => {

        const word = $('ngWord').value.trim();

        if (!word) {
            alert('NGワードを入力してください。');
            return;
        }

        adminAction('ng_add', '', word);
    });

    $('removeNg').addEventListener('click', () => {

        const word = $('ngWord').value.trim();

        if (!word) {
            alert('削除するNGワードを入力してください。');
            return;
        }

        adminAction('ng_remove', '', word);
    });

    function renderNGWords(words) {

        $('ngList').textContent =
            words.length
                ? `登録中：${words.join('、')}`
                : '登録中のNGワードはありません。';
    }

    // =========================
    // ランク別権限設定
    // =========================

    function renderPermissionChecks() {

        const rank = $('permissionRank').value;

        const current = permissions[rank] || {};

        const box = $('permissionChecks');

        box.replaceChildren();

        Object.entries(permissionNames).forEach(
            ([key, label]) => {

                const row =
                    document.createElement('label');

                row.className = 'check';

                const input =
                    document.createElement('input');

                input.type = 'checkbox';

                input.dataset.permission = key;

                input.checked = !!current[key];

                input.disabled = myRole !== 'Owner';

                const text =
                    document.createTextNode(` ${label}`);

                row.appendChild(input);
                row.appendChild(text);

                box.appendChild(row);
            }
        );
    }

    $('permissionRank').addEventListener(
        'change',
        renderPermissionChecks
    );

    $('savePermissions').addEventListener(
        'click',
        () => {

            if (myRole !== 'Owner') {
                alert('権限設定はOwnerのみ変更できます。');
                return;
            }

            const rank =
                $('permissionRank').value;

            const values = {};

            $('permissionChecks')
                .querySelectorAll('input[data-permission]')
                .forEach(input => {

                    values[input.dataset.permission] =
                        input.checked;
                });

            socket.emit('admin_action', {
                action: 'set_permissions',
                rank,
                value: values
            });
        }
    );

})();
</script>

</body>
</html>
